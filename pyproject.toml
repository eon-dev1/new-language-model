[project]
name = "nlm-backend"
version = "0.0.0"
description = "NLM Bible Translation Platform — FastAPI backend dependencies"
requires-python = ">=3.14.10"
dependencies = [
    "fastapi==0.136.0",
    "uvicorn[standard]==0.44.0",
    "motor==3.7.1",
    "pymongo==4.19.0",
    "pydantic==2.13.2",
    "pydantic-settings==2.15.0",
    "anthropic==0.96.0",
    "mcp==1.30.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "pip-licenses==5.5.5",
]

[tool.uv]
package = false
exclude-newer = "7 days"
required-version = "==0.13.6"
